[workspace]
resolver = "2"
members = [
    "crates/verity-core",
    "crates/verity-cli",
    "crates/verity-pfp",
    "crates/verity-pfp-wasm",
    "crates/verity-gui",
    "crates/verity-math",
]

# xattr 0.2.3 (via zed-async-tar → gpui) references libc::ENOATTR,
# which newer libc removed on Linux (the real errno is ENODATA).
# Vendored copy carries the one-line per-OS fix.
[patch.crates-io]
xattr = { path = "vendor/xattr-0.2.3" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Coobyk/verity"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
sqlite = "0.37"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "6"
grammers-client = "0.8"
grammers-session = "0.8"
grammers-tl-types = "0.8"
async-trait = "0.1"
tiny-skia = { version = "0.11", features = ["png-format"] }
